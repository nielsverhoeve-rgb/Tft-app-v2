<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trait Forge — TFT Set 18 Enchanted Wilds</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#080a14">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

:root{--void:#080a14;--panel:rgba(255,255,255,.045);--panel2:rgba(255,255,255,.075);--edge:rgba(160,180,255,.16);--txt:#e8ecff;--dim:#8790b5;--moon:#9bd4ff;--violet:#a97bff;--hot:#ff5c8a}
*{box-sizing:border-box}
body{margin:0;color:var(--txt);font-family:"Space Grotesk",system-ui,sans-serif;font-size:14px;line-height:1.5;
 background:var(--void);
 background-image:radial-gradient(900px 500px at 12% -8%,rgba(169,123,255,.20),transparent 60%),radial-gradient(700px 450px at 92% 8%,rgba(78,190,255,.14),transparent 60%);
 background-attachment:fixed}
header{padding:26px 20px 16px;border-bottom:1px solid var(--edge);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-weight:700;font-size:28px;margin:0;letter-spacing:-.03em}
h1 em{font-style:normal;font-weight:400;font-size:14px;color:var(--moon);display:block;letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
.sub{display:none}
main{display:grid;grid-template-columns:minmax(300px,430px) 1fr;min-height:calc(100vh - 92px)}
@media(max-width:900px){main{grid-template-columns:1fr}}
aside{border-right:1px solid var(--edge);padding:18px;display:flex;flex-direction:column;gap:22px}
section.results{padding:18px}
h2{font-weight:500;font-size:12px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.18em;color:var(--dim)}
h2 small{font-family:"DM Mono",monospace;font-size:10px;color:var(--dim);margin-left:10px;letter-spacing:0;text-transform:none}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
label.opt{color:var(--dim);display:flex;align-items:center;gap:6px;cursor:pointer}
.hint{color:var(--dim);font-size:12px}
.num{width:74px;background:rgba(0,0,0,.35);color:var(--txt);border:1px solid var(--edge);border-radius:8px;padding:4px 7px;font-family:"DM Mono",monospace}
.glass,.size,.kz,.card{background:var(--panel);border:1px solid var(--edge);border-radius:16px;backdrop-filter:blur(14px)}
.size{padding:14px 16px 10px}
.size-top{margin-bottom:2px}
.lvl{font-size:44px;line-height:1;font-weight:700;letter-spacing:-.04em;background:linear-gradient(120deg,var(--moon),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.size input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0;cursor:pointer}
.size input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--moon) 0,var(--violet) var(--p,60%),rgba(255,255,255,.1) var(--p,60%))}
.size input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.1)}
.size input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--moon)}
.size input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(155,212,255,.22),0 0 18px rgba(155,212,255,.8)}
.size input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(155,212,255,.22),0 0 18px rgba(155,212,255,.8)}
.ticks{display:flex;justify-content:space-between;padding:4px 4px 0;font-family:"DM Mono",monospace;font-size:10px;color:var(--dim)}
.ticks span{cursor:pointer;width:1.6em;text-align:center}
.ticks span.on{color:var(--moon)}
.emblems{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:7px}
.emb{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:9px 12px;transition:all .16s;position:relative;overflow:hidden;cursor:pointer;font:inherit;color:var(--dim);text-align:left;-webkit-tap-highlight-color:transparent}
.emb::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 140% at 0% 50%,var(--tc),transparent 62%);opacity:.08;transition:opacity .16s}
.emb:hover{border-color:color-mix(in srgb,var(--tc) 40%,transparent)}
.emb.on{color:var(--txt);border-color:color-mix(in srgb,var(--tc) 65%,transparent);box-shadow:0 0 22px -6px var(--tc)}
.emb.on::before{opacity:.36}
.emb.many::before{opacity:.62}
.emb.many{box-shadow:0 0 30px -6px var(--tc),inset 0 0 0 1px color-mix(in srgb,var(--tc) 45%,transparent)}
.emb span{font-size:12.5px;position:relative;font-weight:500}
.emb b{position:relative;font-family:"DM Mono",monospace;font-size:12px;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;background:var(--tc);color:#080a14;font-weight:500}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{flex:1 1 auto;background:var(--panel);color:var(--dim);border:1px solid var(--edge);border-radius:999px;padding:9px 12px;font-family:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap;transition:all .16s}
.tabs button:hover{color:var(--txt)}
.tabs button.on{color:#0b0f1c;background:linear-gradient(120deg,var(--moon),var(--violet));border-color:transparent;font-weight:500}
.panel{margin-top:12px}
.advice{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;padding:10px 14px;border-radius:12px;border:1px solid var(--edge);background:var(--panel);font-size:13px;color:var(--dim)}
.advice:empty{display:none}
.advice .lead{color:var(--txt);font-weight:500}
.advice b{color:var(--moon);font-weight:700;font-size:15px}
.advice i{font-style:normal;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--tc) 55%,transparent);background:color-mix(in srgb,var(--tc) 14%,transparent);color:var(--txt)}
.flags{display:flex;flex-direction:column;gap:5px;margin:10px 0 0}
.flag{display:flex;align-items:center;gap:7px;font-size:12px;line-height:1.35;padding:6px 11px;border-radius:10px;border:1px solid;background:rgba(255,255,255,.03)}
.flag .ftag{font-family:"DM Mono",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;flex:none}
.flag .fcnt{font-family:"DM Mono",monospace;font-size:10.5px;color:var(--dim);flex:none;width:2.2em;text-align:left}
.flag .fmsg{flex:1;min-width:0}
.etag{flex:none;width:104px;text-align:center;font-size:11px;font-weight:500;padding:2px 6px;border-radius:7px;color:var(--txt);border:1px solid color-mix(in srgb,var(--tc) 60%,transparent);background:color-mix(in srgb,var(--tc) 16%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:430px){.etag{width:88px;font-size:10px}}
.flag.red{border-color:rgba(255,92,138,.32)}
.flag.red .ftag{color:var(--hot)}
.flag.red .fmsg{color:#f0c2d0}
.flag.amber{border-color:rgba(255,180,84,.3)}
.flag.amber .ftag{color:#ffb454}
.flag.amber .fmsg{color:#e8d5b8}
.nextbox{margin:0 0 16px}
.nextbtn{width:100%;background:var(--panel);color:var(--dim);border:1px solid var(--edge);border-radius:12px;padding:11px 14px;font-family:inherit;font-size:13px;cursor:pointer;transition:all .16s;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px}
.nextbtn::after{content:"";width:7px;height:7px;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);transform:rotate(45deg);margin-right:3px;transition:transform .15s;flex:none}
.nextbtn.open::after{transform:rotate(-135deg)}
.nextbtn:hover{color:var(--txt);border-color:var(--moon)}
.nextbtn:disabled{opacity:.6;cursor:wait}
.nextout{margin-top:9px;padding:12px 14px;border:1px solid var(--edge);border-radius:12px;background:var(--panel);font-size:13px;color:var(--dim)}
.nextout .hd{color:var(--txt);margin-bottom:9px}
.nextout .hd b{color:var(--moon);font-weight:700;font-size:15px}
.nextpills{display:flex;flex-wrap:wrap;gap:6px}
.nextpills .etag{width:auto;padding:4px 11px;font-size:11.5px}
.reforge{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.reforge span{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--tc) 55%,transparent);background:color-mix(in srgb,var(--tc) 12%,transparent);color:var(--txt);font-size:13px;box-shadow:0 0 20px -8px var(--tc)}
.reforge span::before{content:"⚒";color:var(--tc)}
.reforge b{color:var(--tc);font-weight:500}
.reset{background:rgba(0,0,0,.3);color:var(--dim);border:1px solid var(--edge);border-radius:999px;padding:6px 14px;font-family:inherit;font-size:12px;cursor:pointer;transition:all .16s}
.reset:hover{color:var(--hot);border-color:var(--hot);box-shadow:0 0 16px -6px var(--hot)}
.kz{padding:13px 15px}
.kz .head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.kz .name{font-weight:700;font-size:16px}
.kz .base{font-family:"DM Mono",monospace;font-size:10px;padding:3px 10px;border-radius:999px;border:1px solid var(--violet);color:var(--violet);margin-left:auto;letter-spacing:.08em;text-transform:uppercase}
.evo{display:flex;flex-wrap:wrap;gap:7px}
.evo label{cursor:pointer}
.evo input{position:absolute;opacity:0;width:0;height:0}
.evo span{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;border:1px solid var(--edge);background:rgba(0,0,0,.25);color:var(--dim);font-size:12px;transition:all .16s}
.evo span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--dim);opacity:.5}
.evo input:checked+span{border-color:var(--moon);color:var(--txt);background:rgba(155,212,255,.12);box-shadow:0 0 18px -6px var(--moon)}
.evo input:checked+span::before{background:var(--moon);opacity:1;box-shadow:0 0 8px var(--moon)}
.evo input.exc:checked+span{border-color:var(--hot);background:rgba(255,92,138,.12);box-shadow:0 0 18px -6px var(--hot)}
.evo input.exc:checked+span::before{background:var(--hot);box-shadow:0 0 8px var(--hot)}
.evo input:focus-visible+span{outline:2px solid var(--violet);outline-offset:3px}
.champs{display:flex;flex-direction:column;gap:6px}
.costrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{border:1px solid var(--edge);background:var(--panel);border-radius:9px;padding:4px 9px;font-size:12px;cursor:pointer;user-select:none;border-left:3px solid;transition:all .14s}
.chip:hover{background:var(--panel2)}
.chip.inc{background:rgba(155,212,255,.16);border-color:var(--moon);color:#fff}
.chip.exc{opacity:.3;text-decoration:line-through}
.chip[data-c="1"],.u[data-c="1"]{border-left-color:#8f9ab8}.chip[data-c="2"],.u[data-c="2"]{border-left-color:#4fd18a}.chip[data-c="3"],.u[data-c="3"]{border-left-color:#4fa8ff}.chip[data-c="4"],.u[data-c="4"]{border-left-color:#c46bff}.chip[data-c="5"],.u[data-c="5"]{border-left-color:#ffc85c}
.go{background:linear-gradient(120deg,var(--moon),var(--violet));color:#080a14;border:0;padding:14px 16px;font-weight:700;font-size:15px;border-radius:14px;cursor:pointer;font-family:inherit;letter-spacing:-.01em;box-shadow:0 10px 34px -12px var(--violet)}
.go:hover{filter:brightness(1.08)}
.go:disabled{opacity:.45;cursor:wait}
.copy{background:rgba(0,0,0,.3);color:var(--moon);border:1px solid var(--edge);padding:6px 12px;border-radius:999px;cursor:pointer;font-family:"DM Mono",monospace;font-size:11px}
.copy:hover{border-color:var(--moon);box-shadow:0 0 16px -6px var(--moon)}
.card{padding:15px 16px;margin-bottom:13px}
.card.best{border-color:rgba(169,123,255,.5);box-shadow:0 0 44px -18px var(--violet)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.score{font-size:38px;line-height:1;font-weight:700;letter-spacing:-.04em;background:linear-gradient(120deg,var(--moon),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.score small{font-family:"DM Mono",monospace;font-size:10px;color:var(--dim);margin-left:9px;font-weight:400;-webkit-text-fill-color:var(--dim)}
.pu{width:var(--ps,54px);flex:0 0 auto;text-align:center;position:relative}
.pu[data-small]{--ps:42px}
.pp{width:var(--ps,54px);height:var(--ps,54px);border-radius:10px;overflow:hidden;border:2px solid var(--pc);background:#10131f;display:block;position:relative}
.pp img{width:100%;height:100%;object-fit:cover;display:block}
.pp.noimg::after{content:attr(data-i);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"DM Mono",monospace;font-size:15px;color:var(--pc)}
.pn{display:block;font-size:9.5px;color:var(--dim);margin-top:3px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb{position:absolute;top:-5px;right:-5px;font-family:"DM Mono",monospace;font-size:9px;background:var(--void);border:1px solid var(--edge);color:var(--moon);border-radius:6px;padding:1px 4px}
.pu[data-c="1"]{--pc:#8f9ab8}.pu[data-c="2"]{--pc:#4fd18a}.pu[data-c="3"]{--pc:#4fa8ff}.pu[data-c="4"]{--pc:#c46bff}.pu[data-c="5"]{--pc:#ffc85c}
.pgrid{display:flex;gap:8px;flex-wrap:wrap}
.tier{margin-bottom:12px}.tier:last-child{margin-bottom:0}
.tl{display:flex;align-items:center;gap:8px;font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--dim);margin-bottom:7px}
.tl b{font-weight:500;color:var(--moon)}
.tl .rule{flex:1;height:1px;background:var(--edge)}
.fillrow{display:flex;gap:7px;align-items:center;padding:7px 9px;border-radius:11px;border:1px dashed var(--edge);margin-bottom:6px;overflow-x:auto}
.fillrow .fl{font-family:"DM Mono",monospace;font-size:10px;color:var(--dim);flex:0 0 auto;min-width:20px}
.morefill{font-size:11.5px;color:var(--dim);font-family:"DM Mono",monospace;padding-left:2px}
.god{position:relative;border-radius:18px;padding:2px;margin-bottom:13px;background:linear-gradient(120deg,#ffca4a,var(--hot) 40%,var(--violet) 75%,var(--moon));box-shadow:0 0 40px -14px #ffca4a}
.god>.in{background:#0b0e19;border-radius:16px;padding:15px 16px}
.godtag{display:inline-flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#ffca4a;margin-bottom:4px}
.godtag::before{content:"";width:5px;height:5px;border-radius:50%;background:#ffca4a;box-shadow:0 0 9px #ffca4a}
.godhd{font-size:15px;font-weight:700;letter-spacing:-.02em}
.godsub{font-size:12px;color:var(--dim);margin-bottom:12px}
.ceil{display:flex;gap:9px;padding:11px 14px;border-radius:12px;border:1px solid rgba(255,92,138,.4);background:rgba(255,92,138,.08);font-size:12.5px;margin-bottom:13px}
.vtabs{display:flex;gap:6px;margin-bottom:12px}
.vtabs button{background:var(--panel);color:var(--dim);border:1px solid var(--edge);border-radius:999px;padding:7px 14px;font-family:inherit;font-size:12px;cursor:pointer}
.vtabs button.on{color:#0b0f1c;background:linear-gradient(120deg,var(--moon),var(--violet));border-color:transparent;font-weight:500}
@media(max-width:560px){.pu{--ps:46px}.pu[data-small]{--ps:38px}}
.units{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0}
.u{padding:4px 9px;border-radius:9px;background:var(--panel2);border-left:3px solid;font-size:12px}
.u .e{color:var(--moon);font-size:11px;margin-left:4px}
.u .lx{color:var(--violet);font-size:11px;margin-left:4px}
.traits{display:flex;flex-wrap:wrap;gap:6px}
.t{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--edge);background:rgba(0,0,0,.25)}
.t .dots{display:inline-flex;gap:3px}
.t .d{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.16)}
.t .d.f{background:var(--moon);box-shadow:0 0 7px var(--moon)}
.t.off{opacity:.4}
.t .n{font-family:"DM Mono",monospace;color:var(--dim);font-size:10px}
.t.unique{border-style:dashed}
.empty{color:var(--dim);padding:48px 0;text-align:center;font-size:15px}
details{margin-top:9px}summary{cursor:pointer;color:var(--dim);font-size:12px}
.foot{display:none}

</style>
</head>
<body>
<header>
  <h1>Trait Forge <em>Set 18 · Enchanted Wilds</em></h1>
  <button class="reset" id="reset">Reset all</button>
</header>
<main>
<aside>
  <div>
    <h2>Team size</h2>
    <div class="size">
      <div class="size-top"><span class="lvl" id="lvlv">9</span></div>
      <input type="range" id="lvl" min="3" max="13" value="9">
      <div class="ticks" id="ticks"></div>
    </div>
    <div class="advice" id="sizeadvice"></div>
  </div>
  <div>
    <h2>Emblems</h2>
    <div class="emblems" id="emblems"></div>
  </div>
  <div>
    <div class="tabs" id="tabs">
      <button data-tab="kz">Kha'Zix traits</button>
      <button data-tab="ch">Exclude / include champions</button>
      <button data-tab="se">Search controls</button>
    </div>
    <div class="panel" id="tab-kz" hidden>
    <div class="kz">
      <div class="head"><span class="name">Kha'Zix</span><span class="base">Rival</span></div>
      <div class="evo">
        <label><input type="checkbox" class="kzt" value="Executioner" checked><span>Executioner</span></label>
        <label><input type="checkbox" class="kzt" value="Rapidfire" checked><span>Rapidfire</span></label>
        <label><input type="checkbox" class="kzt" value="Ravager" checked><span>Ravager</span></label>
        <label><input type="checkbox" class="kzt" value="Spellweaver" checked><span>Spellweaver</span></label>
      </div>
    </div>
    </div>
    <div class="panel" id="tab-ch" hidden>
    <div class="champs" id="champs"></div>
    </div>
    <div class="panel" id="tab-se" hidden>
    <div class="kz" style="display:flex;flex-direction:column;gap:10px">
      <div>
        <div class="hint" style="margin-bottom:5px">After trait count, prefer</div>
        <div class="evo seg">
          <label><input type="radio" name="costpref" value="1"><span>Higher cost</span></label>
          <label><input type="radio" name="costpref" value="0" checked><span>Don't care</span></label>
          <label><input type="radio" name="costpref" value="-1"><span>Lower cost</span></label>
        </div>
      </div>
      <div>
        <div class="hint" style="margin-bottom:5px">Exclude costs</div>
        <div class="evo">
          <label><input type="checkbox" class="exc" value="1"><span>1</span></label>
          <label><input type="checkbox" class="exc" value="2"><span>2</span></label>
          <label><input type="checkbox" class="exc" value="3"><span>3</span></label>
          <label><input type="checkbox" class="exc" value="4"><span>4</span></label>
          <label><input type="checkbox" class="exc" value="5"><span>5</span></label>
        </div>
      </div>
      <label class="opt">Beam width <input type="number" id="beam" class="num" value="1000" min="50" max="2000" step="50"></label>
    </div>
    </div>
  </div>
  <button class="go" id="go">Find best boards</button>
  <div class="hint" id="status"></div>
</aside>
<section class="results">
  <div class="nextbox" id="nextbox" hidden>
    <button class="nextbtn" id="nextbtn">What one more emblem would add</button>
    <div class="nextout" id="nextout" hidden></div>
  </div>
  <h2>Results<small id="rmeta"></small></h2>
  <div id="out"><div class="empty">Set your level and emblems, require a few units if you like, then hit Find best boards.</div></div>
</section>
</main>
<script>
// ---------- DATA (PBE 2026-08-20, tftraits.com) ----------
const TRAITS = {
  Adaptor:{bp:[2,3,4]}, Blackthorn:{bp:[2,4,6]}, Blossom:{bp:[3,5,7,9,11]}, Brawler:{bp:[2,4,6]},
  Coven:{bp:[3,4,5,7]}, Defender:{bp:[2,4,6]}, Elderwood:{bp:[3,5,7,9,11]}, Executioner:{bp:[2,3,4]},
  Fae:{bp:[2,4]}, "Flora Fatalis":{bp:[1,2]}, Hunter:{bp:[2,3,4,5]}, Inferno:{bp:[2,3,5,7]},
  Invoker:{bp:[2,3,4,5]}, Juggernaut:{bp:[2,4,6]}, Lunar:{bp:[2,3,4,5]}, Primal:{bp:[2,4]},
  Rapidfire:{bp:[2,3,4,5]}, Ravager:{bp:[2,4,6]}, Riftbeast:{bp:[3,5,7,10]}, Rival:{bp:[1,2]},
  Solar:{bp:[3]}, Spellweaver:{bp:[2,4,6]}, Sprykin:{bp:[3,5,7]}, Summoner:{bp:[2,3]}, Vanguard:{bp:[2,4,6]},

function teamCode(board, rank){
  // The team planner holds 10 units. Sort cheapest-first so the cheap units that
  // hold the build together survive; Kha'Zix always sorts last, so at size 11+
  // he is the first one left out. Ties within a cost are broken by how often the
  // unit appears across this build's fill options (rank), so the units you can
  // least easily swap stay in the code.
  const units=board.map(id=>CHAMPS[id]);
  const score=c=>rank&&rank[c.id]!==undefined?rank[c.id]:c.traits.length;
  const ordered=[...units].sort((a,b)=>{
    const ka=a.name==="Kha'Zix", kb=b.name==="Kha'Zix";
    if(ka!==kb) return ka?1:-1;
    return a.cost-b.cost || score(b)-score(a) || a.name.localeCompare(b.name);
  });
  const kept=ordered.slice(0,10), dropped=ordered.slice(10);
  const missing=kept.filter(c=>!TP[c.name]).map(c=>c.name);
  if(missing.length) return {err:"No code for: "+missing.join(", ")};
  let s="02"; kept.forEach(c=>s+=TP[c.name].toString(16).padStart(3,"0"));
  while(s.length<32) s+="000";
  return {code:s+"TFTSet18", dropped:dropped.map(c=>c.name)};
}

}

function preKey(){
  const held=EMBLEMS.filter(t=>state.emb[t]>0);
  if(held.length===0) return "(none)";
  if(held.length===1 && state.emb[held[0]]===1) return held[0];
  return null;
}
function adviceHTML(size,adv){
  if(!adv) return "";
  return adv.winners.length
    ? `<span class="lead">Best emblem at size ${size}</span> <b>${adv.best}</b> traits vs ${adv.base} without ${adv.winners.map(w=>`<i style="--tc:${TCOLOR[w]||"#9bd4ff"}">${w}</i>`).join("")}`
    : `<span class="lead">Size ${size}</span> no emblem improves on ${adv.base} traits`;
}
function preAdvice(size){
  const p=PRE[size]; if(!p) return null;
  const base=p["(none)"].n;
  const rank={};
  EMBLEMS.forEach(e=>{ if(p[e]) rank[e]=p[e].n; });
  const best=Math.max(base,...Object.values(rank));
  const winners=EMBLEMS.filter(e=>p[e]&&p[e].n===best&&best>base);
  return {base,best,winners};
}

const NONU = Object.keys(TRAITS).filter(t=>!TRAITS[t].u);
function countTraits(board, luxOrigin){
  const cnt={};
  for(const id of board){
    for(const t of CHAMPS[id].traits) cnt[t]=(cnt[t]||0)+1;
    if(id===ED) cnt.Riftbeast=(cnt.Riftbeast||0)+1;
    if(id===LUX && luxOrigin) cnt[luxOrigin]=(cnt[luxOrigin]||0)+2;
  }
  return cnt;
}
function need(t,n){ for(const b of TRAITS[t].bp) if(n<b) return b-n; return 99; }
function tier(t,n){ let k=0; for(const b of TRAITS[t].bp) if(n>=b) k++; return k; }
function applyEmblems(board, cnt, emb){
  const load={}; board.forEach(id=>load[id]=0);
  const assign=[], out={...cnt};
  const order=Object.keys(emb).filter(t=>emb[t]>0).sort((a,b)=>need(a,out[a]||0)-need(b,out[b]||0));
  for(const t of order){
    let left=emb[t];
    while(left>0){
      let best=null;
      for(const id of board){
        if(CHAMPS[id].traits.includes(t)||load[id]>=3) continue;
        if(best===null||load[id]<load[best]) best=id;
      }
      if(best===null) break;
      load[best]++; assign.push({id:best,trait:t}); out[t]=(out[t]||0)+1; left--;
    }
  }
  return {cnt:out, assign};
}
function evaluate(board, opts){
  const origins=board.includes(LUX)?LUX_ORIGINS:[null];
  let best=null;
  for(const lo of origins){
    const {cnt,assign}=applyEmblems(board,countTraits(board,lo),opts.emb||state.emb);
    let active=0, tiers=0, prog=0;
    for(const t of NONU){
      const n=cnt[t]||0; if(!n) continue;
      const k=tier(t,n);
      if(k>0){active++; tiers+=k;} else prog+=n/TRAITS[t].bp[0];
    }
    let cost=0; board.forEach(id=>cost+=CHAMPS[id].cost);
    // how many of the emblems you hold end up doing nothing on this board
    let spare=0;
    for(const t of EMBLEMS){
      const held=(opts.emb||state.emb)[t]||0; if(!held) continue;
      const used=assign.filter(a=>a.trait===t).length;
      spare+=held-used;                       // never placed at all
      if(!used) continue;
      const n=cnt[t]||0, bare=n-used, b1=TRAITS[t].bp[0];
      const needed=(tier(t,n)>0&&bare<b1)?Math.min(used,b1-bare):0;
      spare+=used-needed;                     // placed but not load-bearing
    }
    const score=active*1e8 + spare*1e6 + opts.costPref*cost*1000 + tiers*100 + prog*10;
    if(!best||score>best.score) best={score,active,tiers,cnt,assign,lux:lo,cost,spare};
  }
  return best;
}
const slotsUsed=b=>b.reduce((s,id)=>s+CHAMPS[id].slots,0);
const key=b=>[...b].sort((a,b)=>a-b).join(",");

function search(opts){
  const forced=CHAMPS.filter(c=>state.mark[c.id]===1).map(c=>c.id);
  const pool=CHAMPS.filter(c=>state.mark[c.id]!==2 && !opts.exclude.has(c.cost) && (c.id!==LUX||state.mark[c.id]===1)).map(c=>c.id);
  if(slotsUsed(forced)>opts.size) return {err:"Required units use more slots than your level allows."};
  let beam=[{b:forced, ev:evaluate(forced,opts)}];
  const seen=new Set([key(forced)]);
  while(true){
    const next=[]; let grew=false;
    for(const st of beam){
      const used=slotsUsed(st.b);
      if(used>=opts.size){ next.push(st); continue; }
      for(const id of pool){
        if(st.b.includes(id)||used+CHAMPS[id].slots>opts.size) continue;
        const b=[...st.b,id], k=key(b);
        if(seen.has(k)) continue; seen.add(k);
        next.push({b,ev:evaluate(b,opts)}); grew=true;
      }
    }
    if(!grew) break;
    next.sort((x,y)=>y.ev.score-x.ev.score);
    beam=next.slice(0,opts.beam);
  }
  const forcedSet=new Set(forced), improved=[];
  for(const st of beam.slice(0,Math.min(60,beam.length))){
    let cur=st, changed=true, iter=0;
    while(changed && iter++<6){
      changed=false;
      for(let i=0;i<cur.b.length;i++){
        if(forcedSet.has(cur.b[i])) continue;
        for(const id of pool){
          if(cur.b.includes(id)) continue;
          const b=cur.b.slice(); b[i]=id;
          if(slotsUsed(b)>opts.size) continue;
          const k=key(b); if(seen.has(k)) continue; seen.add(k);
          const ev=evaluate(b,opts);
          if(ev.score>cur.ev.score){cur={b,ev}; changed=true;}
        }
      }
    }
    improved.push(cur);
  }
  const all=[...improved,...beam].sort((x,y)=>y.ev.score-x.ev.score);
  const uniq=[], ks=new Set();
  for(const s of all){ const k=key(s.b); if(ks.has(k)) continue; ks.add(k); uniq.push(s); if(uniq.length>=10) break; }
  return {res:uniq, explored:seen.size, pool:all};
}


/* ---------- offline ceiling -----------------------------------------------
   Highest trait count the offline search reached, per team size and per emblem

function ceilingFor(size,emb){
  const B=CE_B[size]; if(B===undefined) return null;
  const ms=[]; for(const t in emb) for(let i=0;i<(emb[t]||0);i++){const k=CE_E.indexOf(t); if(k>=0) ms.push(k);}
  if(!ms.length) return B;
  if(ms.length>5) return null;             // stored table covers up to five
  ms.sort((a,b)=>a-b);
  let best=B;
  for(const [combo,mx] of (CE_C[size]||[])){
    if(combo.length>ms.length||mx<=best) continue;
    const pool=[...ms]; let ok=true;
    for(const x of combo){const p=pool.indexOf(x); if(p<0){ok=false;break;} pool.splice(p,1);}
    if(ok) best=mx;
  }
  return best;
}

/* ---------- build clustering ----------------------------------------------
   Groups the boards that reach the maximum into a few distinct builds. Two
   clusters merge only while the units they share stay at or above minCore, so
   what survives are genuinely different directions rather than swap variants. */
function clusterBoards(boards,size,minCore,maxBuilds){
  if(!boards.length) return [];
  let cl=boards.map(b=>({m:[b],core:new Set(b)}));
  const inter=(a,b)=>{const s=new Set();for(const x of a) if(b.has(x)) s.add(x);return s;};
  while(cl.length>1){
    let best=null;
    for(let i=0;i<cl.length;i++) for(let j=i+1;j<cl.length;j++){
      const c=inter(cl[i].core,cl[j].core);
      if(c.size<minCore) continue;
      const sc=c.size*1000+cl[i].m.length+cl[j].m.length;
      if(!best||sc>best.sc) best={i,j,core:c,sc};
    }
    if(!best) break;
    const merged={m:[...cl[best.i].m,...cl[best.j].m],core:best.core};
    cl=cl.filter((_,k)=>k!==best.i&&k!==best.j); cl.push(merged);
  }
  cl.sort((a,b)=>b.m.length-a.m.length);
  return cl.slice(0,maxBuilds).map(c=>{
    const core=[...c.core];
    const fills=c.m.map(b=>b.filter(id=>!c.core.has(id)));
    const freq={}; for(const f of fills) for(const id of f) freq[id]=(freq[id]||0)+1;
    const n=fills.length;
    const semi=Object.entries(freq).filter(([,k])=>k/n>=0.5)
      .map(([id,k])=>({id:+id,k,n})).sort((a,b)=>b.k-a.k);
    const semiIds=new Set(semi.map(s=>s.id));
    const seen=new Set(), uniq=[];
    for(const f of fills.map(f=>f.filter(id=>!semiIds.has(id)))){
      const k=[...f].sort((a,b)=>a-b).join(","); if(seen.has(k))continue; seen.add(k); uniq.push(f);
    }
    const rank={}; core.forEach(id=>rank[id]=1e6);
    for(const id in freq) if(rank[id]===undefined) rank[id]=freq[id];
    return {core,semi,fills:uniq,n,rank,boards:c.m};
  });
}

function boardCard(s,i,opts,plain){
  const ev=s.ev, embByUnit={};
  ev.assign.forEach(a=>(embByUnit[a.id]=embByUnit[a.id]||[]).push(a.trait));
  const units=[...s.b].sort((a,b)=>CHAMPS[a].cost-CHAMPS[b].cost||CHAMPS[a].name.localeCompare(CHAMPS[b].name)).map(id=>{
    const c=CHAMPS[id];
    return `<span class="u" data-c="${c.cost}">${c.name}${id===LUX&&ev.lux?`<span class="lx">\u2605 ${ev.lux}</span>`:""}${embByUnit[id]?`<span class="e">+${embByUnit[id].join(", +")}</span>`:""}</span>`;
  }).join("");
  const entries=Object.entries(ev.cnt).sort((a,b)=>{
    const ka=tier(a[0],a[1])>0, kb=tier(b[0],b[1])>0;
    if(ka!==kb) return ka?-1:1;
    if(!!TRAITS[a[0]].u!==!!TRAITS[b[0]].u) return TRAITS[a[0]].u?1:-1;
    return b[1]-a[1];
  });
  const on=entries.filter(([t,n])=>tier(t,n)>0), off=entries.filter(([t,n])=>tier(t,n)===0);
  const nonu=on.filter(([t])=>!TRAITS[t].u).length, uq=on.length-nonu;
  const flags=[];
  for(const t of EMBLEMS){
    const held=opts.emb[t]||0; if(!held) continue;
    const used=ev.assign.filter(a=>a.trait===t).length;
    const n=ev.cnt[t]||0, bare=n-used, b1=TRAITS[t].bp[0];
    const needed=(used&&tier(t,n)>0&&bare<b1)?Math.min(used,b1-bare):0;
    const sp=held-needed; if(!sp) continue;
    const dead=!used||tier(t,n)===0;
    flags.push({t,lvl:dead?"red":"amber",tag:"Reforge",count:sp>1?sp:0,
      msg:dead?`${sp===1?"is":"are"} not used`:`would still be active at ${Math.max(bare,b1)}`});
  }
  const flagged=new Set(flags.map(f=>f.t));
  for(const [t,n] of entries){
    if(TRAITS[t].u||flagged.has(t)) continue;
    const bp=TRAITS[t].bp;
    if(n<=bp[0]||bp.includes(n)) continue;
    flags.push({t,lvl:"amber",tag:"Reforge",count:0,msg:`would still be active at ${bp.filter(b=>b<=n).pop()}`});
  }
  const flagBar=flags.length?`<div class="flags">${flags.map(f=>`<div class="flag ${f.lvl}"><span class="ftag">${f.tag}</span><span class="etag" style="--tc:${TCOLOR[f.t]||"#8790b5"}">${f.t}</span><span class="fcnt">${f.count?"("+f.count+")":""}</span><span class="fmsg">${f.msg}</span></div>`).join("")}</div>`:"";
  return `<div class="card${i===0&&!plain?" best":""}">
    <div class="top"><span class="score">${nonu}<small>active non-unique traits${uq?` \u00b7 ${uq} unique`:""}</small></span><span class="row"><button class="copy" onclick="copyCode(${i},this)">Copy team code</button><span class="hint">#${i+1}</span></span></div>
    ${flagBar}<div class="units">${units}</div>
    <div class="traits">${on.map(([t,n])=>traitPill(t,n)).join("")}</div>
    ${off.length?`<details><summary>${off.length} inactive / close</summary><div class="traits" style="margin-top:6px">${off.map(([t,n])=>traitPill(t,n)).join("")}</div></details>`:""}
  </div>`;
}

        <div class="godsub">${boards.length===1?"Nothing to flex \u2014 this board, or you drop a trait.":"Only two boards reach "+max+"."}</div>
        <div class="pgrid">${b.map(id=>unitTile(id)).join("")}</div>
        <div class="traits" style="margin-top:11px">${activeTraits(b,opts).map(([t,n])=>traitPill(t,n)).join("")}</div>
        <div style="margin-top:12px;text-align:right"><button class="copy" onclick="copyCode(${i},this)">Copy team code</button></div>
      </div></div>`;
    }).join("")+note;
  }

  const builds=clusterBoards(boards,opts.size,Math.ceil(opts.size*0.5),5).filter(b=>b.n>=3);
  if(!builds.length){
    return head+`<div class="hint" style="margin-bottom:10px">Too few boards to group into builds.</div>`+
      boards.slice(0,3).map((b,i)=>{
        window._codeSrc.push({b});
        return `<div class="card"><div class="top"><span class="score">${max}<small>active non-unique traits</small></span>
          <button class="copy" onclick="copyCode(${i},this)">Copy team code</button></div>
          <div class="pgrid" style="margin:11px 0">${b.map(id=>unitTile(id)).join("")}</div>
          <div class="traits">${activeTraits(b,opts).map(([t,n])=>traitPill(t,n)).join("")}</div></div>`;
      }).join("")+note;
  }

  return head+builds.map((b,i)=>{
    window._codeSrc.push({b:b.boards[0],rank:b.rank});
    const fills=b.fills.slice(0,4);
    const fillHTML=b.fills.length?`<div class="tier"><div class="tl"><b>Fill</b><span>pick one row</span><span class="rule"></span></div>
      ${fills.map((f,k)=>`<div class="fillrow"><span class="fl">${String.fromCharCode(97+k)}</span>${
        f.length?f.map(id=>unitTile(id,{small:1})).join(""):'<span class="morefill">nothing else needed</span>'}</div>`).join("")}
      ${b.fills.length>4?`<div class="morefill">+${b.fills.length-4} more</div>`:""}</div>`:"";
    return `<div class="card${i===0?" best":""}">
      <div class="top"><span class="score">${i+1}<small>core of ${b.core.length} \u00b7 ${b.n} boards</small></span>
        <button class="copy" onclick="copyCode(${i},this)">Copy team code</button></div>
      <div class="tier" style="margin-top:12px"><div class="tl"><b>Core</b><span>in every board</span><span class="rule"></span></div>
        <div class="pgrid">${b.core.map(id=>unitTile(id)).join("")}</div></div>
      ${b.semi.length?`<div class="tier"><div class="tl"><b>Usually</b><span>in most fills</span><span class="rule"></span></div>
        <div class="pgrid">${b.semi.map(s=>unitTile(s.id,{badge:s.k+"/"+s.n})).join("")}</div></div>`:""}
      ${fillHTML}
      <div class="traits" style="margin-top:11px">${activeTraits(b.boards[0],opts).map(([t,n])=>traitPill(t,n)).join("")}</div>
    </div>`;
  }).join("")+note;
}

function render(r,opts){
  const out=$("#out");
  if(r.err){out.innerHTML=`<div class="empty">${r.err}</div>`;return;}
  $("#rmeta").textContent=(r.precomputed?"solved offline \u00b7 ":"")+`${r.explored.toLocaleString("en")} boards explored \u00b7 size ${opts.size}`;
  window._r=r; window._ropts=opts;
  const short=(r.ceiling&&r.ceiling>r.res[0].ev.active)
    ? `<div class="ceil"><div><b>The search came up short.</b> It found ${r.res[0].ev.active} traits, but ${r.ceiling} is reachable with these emblems at size ${opts.size}. Try a wider beam.</div></div>` : "";
  out.innerHTML=short+`<div class="vtabs"><button id="vb" onclick="setView('b')">Builds</button><button id="vl" onclick="setView('l')">All boards</button></div><div id="vout"></div>`;
  setView(window._view||"b");
}
function setView(v){
  window._view=v;
  const r=window._r, opts=window._ropts;
  $("#vb").classList.toggle("on",v==="b"); $("#vl").classList.toggle("on",v==="l");
  if(v==="b") $("#vout").innerHTML=buildsHTML(r,opts);
  else { window._codeSrc=r.res.map(s=>({b:s.b})); $("#vout").innerHTML=r.res.map((s,i)=>boardCard(s,i,opts,true)).join(""); }
}

$("#nextbtn").onclick=()=>{
  const box=$("#nextout"), btn=$("#nextbtn");
  if(!box.hidden){ box.hidden=true; btn.classList.remove("open"); return; }
  if(window._nextHTML){ box.innerHTML=window._nextHTML; box.hidden=false; btn.classList.add("open"); return; }
  btn.disabled=true; btn.textContent="Checking each emblem…";
  setTimeout(()=>{
    const o=window._opts, base=window._baseBest;
    const beam=Math.min(o.beam,500), rows=[];
    for(const t of EMBLEMS){
      const emb={...o.emb}; emb[t]=(emb[t]||0)+1;
      const r=search({...o,emb,beam});
      if(!r.err) rows.push({t,n:r.res[0].ev.active});
    }
    const top=Math.max(...rows.map(r=>r.n));
    const win=rows.filter(r=>r.n===top).map(r=>r.t);
    window._nextHTML = top>base
      ? `<div class="hd">One more emblem takes you from ${base} to <b>${top}</b> traits at size ${o.size}</div>`+
        `<div class="nextpills">${win.map(t=>`<span class="etag" style="--tc:${TCOLOR[t]}">${t}</span>`).join("")}</div>`
      : `<div class="hd">No single emblem beats ${base} traits at size ${o.size}.</div>`;
    box.innerHTML=window._nextHTML;
    box.hidden=false; btn.classList.add("open");
    btn.disabled=false; btn.textContent="What one more emblem would add";
  },20);
};
$("#reset").onclick=()=>{
  EMBLEMS.forEach(t=>state.emb[t]=0);
  state.mark={};
  buildEmblems(); buildChamps();
  document.querySelectorAll(".kzt").forEach(e=>e.checked=true);
  document.querySelectorAll(".exc").forEach(e=>e.checked=false);
  document.querySelector('input[name=costpref][value="0"]').checked=true;
  $("#beam").value=1000; setLvl(9);
  window._res=[]; window._opts=null; window._nextHTML=null; $("#rmeta").textContent="";
  $("#nextbox").hidden=true; $("#nextout").hidden=true; $("#nextbtn").classList.remove("open");
  $("#out").innerHTML='<div class="empty">Set your team size and emblems, require a few units if you like, then hit Find best boards.</div>';
  $("#status").textContent="";
};
$("#go").onclick=()=>{
  KZ.traits=["Rival",...[...document.querySelectorAll(".kzt:checked")].map(e=>e.value)];
  const opts={ size:+$("#lvl").value, costPref:+document.querySelector('input[name=costpref]:checked').value, exclude:new Set([...document.querySelectorAll(".exc:checked")].map(e=>+e.value)), beam:+$("#beam").value||1000, emb:{...state.emb} };
  $("#go").disabled=true; $("#status").textContent="Searching…";
  setTimeout(()=>{
    const t0=performance.now();
    const noConstraints = Object.keys(state.mark).every(k=>!state.mark[k]) && opts.exclude.size===0
      && [...document.querySelectorAll(".kzt")].every(e=>e.checked);
    const pk = noConstraints ? preKey() : null;
    const preRow = (pk && PRE[opts.size] && PRE[opts.size][pk]) ? PRE[opts.size][pk] : null;
    const pre = preRow ? (opts.costPref<0?preRow.lo:opts.costPref>0?preRow.hi:preRow.any) : null;
    let r;
    if(pre){
      const ids=pre.b.map(n=>CHAMPS.findIndex(c=>c.name===n));
      r={res:[{b:ids,ev:evaluate(ids,opts)}],explored:0,precomputed:true};
      const extra=search({...opts,beam:Math.min(opts.beam,400)});
      if(!extra.err){
        const seen=new Set([[...ids].sort((a,b)=>a-b).join(",")]);
        for(const s of extra.res){ const k=[...s.b].sort((a,b)=>a-b).join(","); if(!seen.has(k)){seen.add(k); r.res.push(s);} }
        r.res.sort((a,b)=>b.ev.score-a.ev.score);
        r.res=r.res.slice(0,10); r.explored=extra.explored;
      }
    } else r=search(opts);
    if(!r.err) r.ceiling=ceilingFor(opts.size,opts.emb);
    window._view="b";
    render(r,opts);
    window._nextHTML=null;
    $("#nextout").hidden=true; $("#nextbtn").classList.remove("open");
    if(!r.err){ window._opts=opts; window._baseBest=r.res[0].ev.active; $("#nextbox").hidden=false; }
    else $("#nextbox").hidden=true;
    $("#status").textContent=r.err?"":`Done in ${((performance.now()-t0)/1000).toFixed(1)}s`;
    $("#go").disabled=false;
  },20);
};
</script>
